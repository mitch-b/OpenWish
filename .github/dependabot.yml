version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      dotnet:
        patterns:
          - "Microsoft.*"
          - "System.*"
      observability:
        patterns:
          - "OpenTelemetry.*"
    labels:
      - "dependencies"
      - ".NET"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/src/OpenWish.Web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/.agents/skills/screenshot"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "devcontainers_package_manager"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
